name: Font Swap Page

# Publishes fontswap/ to GitHub Pages together with the latest release's sideloaded
# IPA, so the page can read the IPA from its own origin (release downloads have
# no CORS headers). No fonts are published; people pick their own on the page.

on:
  workflow_dispatch:
  push:
    branches: [v7]
    paths:
      - "fontswap/**"
      - ".github/workflows/pages.yml"
  workflow_run:
    workflows: ["Build Tweak"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v7
          sparse-checkout: fontswap

      - name: Add the latest release's IPA
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p fontswap/ipa
          release=$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest")
          tag=$(jq -r .tag_name <<<"$release")
          asset=$(jq -c '[.assets[] | select(.name | test("sideloaded.*\\.ipa$"))][0]' <<<"$release")
          if [ "$asset" = "null" ]; then echo "error: no sideloaded IPA in $tag"; exit 1; fi
          name=$(jq -r .name <<<"$asset")
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern "$name" --dir fontswap/ipa
          jq -n --arg tag "$tag" --arg name "$name" --arg path "ipa/$name" \
                --argjson size "$(jq .size <<<"$asset")" \
                --arg published_at "$(jq -r .published_at <<<"$release")" \
                '{tag: $tag, name: $name, path: $path, size: $size, published_at: $published_at}' > fontswap/latest.json
          cat fontswap/latest.json

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: fontswap

      - id: deployment
        uses: actions/deploy-pages@v4
