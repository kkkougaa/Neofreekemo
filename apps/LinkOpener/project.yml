# The X link opener: a tiny app whose only job is to carry a Safari web extension.
# On x.com / twitter.com pages in Safari, the extension sends the page to the
# NeoFreeBird app through twitter:// (x.com universal links cannot reach a re-signed
# app). This app does not register twitter:// itself, so the link always lands in
# NeoFreeBird. Generated with XcodeGen in CI (.github/workflows/build-linkopener.yml).
name: LinkOpener
options:
  deploymentTarget:
    iOS: "15.0"
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  LinkOpener:
    type: application
    platform: iOS
    sources:
      - path: App
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: X 링크 열기
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.neofreekemo.linkopener
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: LinkOpenerExtension
        embed: true
  LinkOpenerExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: Extension/SafariWebExtensionHandler.swift
      - path: Extension/Resources
        buildPhase: resources
    info:
      path: Extension/Info.plist
      properties:
        CFBundleDisplayName: X 링크 열기
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.Safari.web-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).SafariWebExtensionHandler
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.neofreekemo.linkopener.extension
